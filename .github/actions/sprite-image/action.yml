name: Sprite image
description: >-
  Builds the Sprite image from deploy/image/ (its Dockerfile with what
  the templates need, start.sh, and a clone of the skills repository the
  generic agent offers, the SKILLS_REPO and SKILLS_BRANCH build
  arguments) and pushes it to the private package
  ghcr.io/storrito/rragent-sprite as <tag>. The image holds no bundle:
  start.sh downloads the release at a machine's first start. Sprites
  imports an image tag once per organization and never pulls it again,
  so a tag that exists is never pushed over: refused (the release's
  version tag), or skipped with when-there: skip (the Image workflow's
  tag, the Dockerfile's blob SHA, which exists whenever the file did not
  change).

inputs:
  tag:
    description: The image's tag.
    required: true
  latest:
    description: Tag the image as latest too ("true" for a release).
    required: false
    default: "false"
  when-there:
    description: What to do when the tag exists already, "refuse" (the default) or "skip".
    required: false
    default: refuse
  skills-repo:
    description: The GitHub repository of the skills, owner/name, cloned into the image.
    required: false
    default: storrito/agentitos
  skills-branch:
    description: The branch of the skills repository to clone.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: A tag that exists
      id: there
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
        WHEN_THERE: ${{ inputs.when-there }}
      run: |
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          if [ "$WHEN_THERE" = skip ]; then
            echo "$IMAGE exists already: nothing to build"
            echo "there=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$IMAGE exists already. Sprites imports a tag once per organization and never pulls it again, so a rebuild needs a tag of its own."
            exit 1
          fi
        else
          echo "there=false" >> "$GITHUB_OUTPUT"
        fi

    # The base image is 5.8 GB; the runner's disk has room for it
    # without the toolchains nobody here uses.
    - name: Make room for the base image
      if: steps.there.outputs.there != 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h / | tail -1

    - name: Build the image
      if: steps.there.outputs.there != 'true'
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
        SKILLS_REPO: ${{ inputs.skills-repo }}
        SKILLS_BRANCH: ${{ inputs.skills-branch }}
      run: |
        docker build -f deploy/image/Dockerfile --build-arg "SKILLS_REPO=$SKILLS_REPO" --build-arg "SKILLS_BRANCH=$SKILLS_BRANCH" -t "$IMAGE" deploy/image

    - name: Push the image
      if: steps.there.outputs.there != 'true'
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
        LATEST: ${{ inputs.latest }}
      run: |
        docker push "$IMAGE"
        if [ "$LATEST" = "true" ]; then
          docker tag "$IMAGE" ghcr.io/storrito/rragent-sprite:latest
          docker push ghcr.io/storrito/rragent-sprite:latest
        fi
