name: Sprite image
description: >-
  Builds the Sprite image from deploy/image/ (its Dockerfile with what
  the templates need, and start.sh) and pushes it to the public package
  ghcr.io/storrito/rragent-sprite as <tag>: the Dockerfile's own version
  (its label org.opencontainers.image.version) on main, <version>-trial.<sha>
  for a branch. The image holds no bundle: start.sh downloads the release
  at a machine's first start, and clones the skills. Sprites imports an image tag once per
  organization and never pulls it again, so a tag that exists is never
  pushed over: refused (a version on main that was not bumped), or
  skipped with when-there: skip (a trial built again on the same
  commit).

inputs:
  tag:
    description: The image's tag.
    required: true
  when-there:
    description: What to do when the tag exists already, "refuse" (the default) or "skip".
    required: false
    default: refuse

runs:
  using: composite
  steps:
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: A tag that exists
      id: there
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
        WHEN_THERE: ${{ inputs.when-there }}
      run: |
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          if [ "$WHEN_THERE" = skip ]; then
            echo "$IMAGE exists already: nothing to build"
            echo "there=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::$IMAGE exists already. Sprites imports a tag once per organization and never pulls it again, so a rebuild needs a tag of its own."
            exit 1
          fi
        else
          echo "there=false" >> "$GITHUB_OUTPUT"
        fi

    # The base image is 5.8 GB; the runner's disk has room for it
    # without the toolchains nobody here uses.
    - name: Make room for the base image
      if: steps.there.outputs.there != 'true'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h / | tail -1

    - name: Build the image
      if: steps.there.outputs.there != 'true'
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
      run: |
        docker build -f deploy/image/Dockerfile -t "$IMAGE" deploy/image

    - name: Push the image
      if: steps.there.outputs.there != 'true'
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
      run: docker push "$IMAGE"
