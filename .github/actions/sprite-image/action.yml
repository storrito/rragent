name: Sprite images
description: >-
  Builds the two Sprite images from the dist/ of the checkout and pushes
  them to the private package ghcr.io/storrito/rragent-sprite: the full one
  (deploy/Dockerfile.full, with what the templates need) as <tag>, the
  plain one (deploy/Dockerfile) as <tag>-plain, both with a clone of the
  skills repository the generic agent offers (the SKILLS_REPO and
  SKILLS_BRANCH build arguments of the Dockerfiles). Sprites imports an
  image tag once per organization and never pulls it again, so a tag that
  exists is refused instead of pushed over. The release workflow runs it
  with the version as the tag, the image workflow with a tag of its own.

inputs:
  tag:
    description: The tag of the full image; the plain one is <tag>-plain.
    required: true
  latest:
    description: Tag the full image as latest too ("true" for a release).
    required: false
    default: "false"
  skills-repo:
    description: The GitHub repository of the skills, owner/name, cloned into the images.
    required: false
    default: storrito/agentitos
  skills-branch:
    description: The branch of the skills repository to clone.
    required: false
    default: main

runs:
  using: composite
  steps:
    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Refuse a tag that exists
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
      run: |
        if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
          echo "::error::$IMAGE exists already. Sprites imports a tag once per organization and never pulls it again, so a rebuild needs a tag of its own."
          exit 1
        fi

    # The base image is 5.8 GB; the runner's disk has room for it
    # without the toolchains nobody here uses.
    - name: Make room for the base image
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        df -h / | tail -1

    - name: Build the images
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
        SKILLS_REPO: ${{ inputs.skills-repo }}
        SKILLS_BRANCH: ${{ inputs.skills-branch }}
      run: |
        test -f dist/rragent.js || { echo "::error::no dist/rragent.js: build the bundle first"; exit 1; }
        docker build -f deploy/Dockerfile.full --build-arg "SKILLS_REPO=$SKILLS_REPO" --build-arg "SKILLS_BRANCH=$SKILLS_BRANCH" -t "$IMAGE" .
        docker build -f deploy/Dockerfile --build-arg "SKILLS_REPO=$SKILLS_REPO" --build-arg "SKILLS_BRANCH=$SKILLS_BRANCH" -t "$IMAGE-plain" .

    - name: Push the images
      shell: bash
      env:
        IMAGE: ghcr.io/storrito/rragent-sprite:${{ inputs.tag }}
        LATEST: ${{ inputs.latest }}
      run: |
        docker push "$IMAGE"
        docker push "$IMAGE-plain"
        if [ "$LATEST" = "true" ]; then
          docker tag "$IMAGE" ghcr.io/storrito/rragent-sprite:latest
          docker push ghcr.io/storrito/rragent-sprite:latest
        fi
