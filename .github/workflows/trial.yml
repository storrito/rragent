name: Trial

# A branch on a sprite without a release. "Run workflow" on the branch
# builds its bundle, which says 0.0.0-trial.<sha>, and publishes a
# GitHub pre-release trial-<branch>-<sha> with rragent.tar.gz and its
# checksum; the branch's image is built too, <version>-trial.<sha> of
# the Dockerfile's version label, unless it is there
# (.github/actions/sprite-image, when-there: skip). A
# pre-release is invisible to releases/latest, so no machine takes a
# trial by itself: a sprite takes it with
# RRAGENT_UPDATE=trial-<branch>-<sha> in its .env, deploy/image/start.sh
# at the first start, rragent.update on a running one (a forked sprite
# after a restart), and stays pinned there until the line changes. No
# tests here, the Tests workflow runs them on the branch's PR. A rerun
# on the same commit replaces the pre-release's files.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: clojure-${{ hashFiles('deps.edn') }}
      - name: The trial's tag, the branch and the commit
        id: trial
        run: |
          branch="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          sha="${GITHUB_SHA::7}"
          echo "tag=trial-$branch-$sha" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          version=$(sed -n 's/^LABEL org.opencontainers.image.version="\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"$/\1/p' deploy/image/Dockerfile)
          [ -n "$version" ] || { echo "::error::deploy/image/Dockerfile names no version: LABEL org.opencontainers.image.version=\"<x.y.z>\""; exit 1; }
          echo "image=$version-trial.$sha" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: The bundle says it is a trial
        env:
          SHA: ${{ steps.trial.outputs.sha }}
        run: npm version --no-git-tag-version --allow-same-version "0.0.0-trial.$SHA"
      - run: npm run release
      - name: The branch's image, unless it is there
        uses: ./.github/actions/sprite-image
        with:
          tag: ${{ steps.trial.outputs.image }}
          when-there: skip
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.trial.outputs.tag }}
          IMAGE: ghcr.io/storrito/rragent-sprite:${{ steps.trial.outputs.image }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" rragent.tar.gz rragent.tar.gz.sha256 --clobber
          else
            gh release create "$TAG" rragent.tar.gz rragent.tar.gz.sha256 \
              --prerelease --target "$GITHUB_SHA" \
              --title "trial $GITHUB_REF_NAME $GITHUB_SHA" \
              --notes "A trial of the branch $GITHUB_REF_NAME at $GITHUB_SHA, not a release: a sprite takes it with RRAGENT_UPDATE=$TAG in its .env. Its image: $IMAGE"
          fi
