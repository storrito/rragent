name: Release

# Pushing a tag v<version> builds the bundle and publishes a GitHub
# release with rragent.tar.gz (dist/: rragent.js and public/) and its
# checksum, so that a machine image downloads a release instead of
# building the app: releases/download/v<version>/rragent.tar.gz, or the
# newest from releases/latest/download/rragent.tar.gz. The version in
# the bundle comes from package.json, kept equal to the tag by
# `npm version`. Then the same dist/ goes into the Sprite images,
# ghcr.io/storrito/rragent-sprite:<version> (deploy/Dockerfile.full, and
# latest), <version>-plain (deploy/Dockerfile), see
# .github/actions/sprite-image and the README's Deploy section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: The tag and the package agree
        run: |
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" \
            || { echo "::error::package.json says $(node -p "require('./package.json').version"), the tag is ${GITHUB_REF_NAME}: bump with npm version"; exit 1; }
      - run: npm test
      - run: npm run release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun of the job finds the release already there: the assets are
        # replaced instead, so the image steps after it can run again.
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" rragent.tar.gz rragent.tar.gz.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" rragent.tar.gz rragent.tar.gz.sha256 \
              --title "rragent ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
      - name: The version, from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: The Sprite images
        uses: ./.github/actions/sprite-image
        with:
          tag: ${{ steps.version.outputs.version }}
          latest: "true"
