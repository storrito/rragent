name: Release

# A pushed tag v<x.y.z> on any commit is the release. The version is
# the tag's: set into package.json for this build alone (npm version
# --no-git-tag-version, nothing committed, main keeps 0.0.0), so that
# the bundle says it (scripts/version.mjs writes src/rragent/version.cljs
# from package.json before the build). Then the bundle is built and a
# GitHub release published with rragent.tar.gz (dist/: rragent.js,
# public/ and templates/) and its checksum, so that a machine image
# downloads a release instead of building the app:
# releases/download/v<version>/rragent.tar.gz, or the newest from
# releases/latest/download/rragent.tar.gz, which a running agent takes
# by itself (rragent.update). Then the same dist/ goes into the Sprite
# image, ghcr.io/storrito/rragent-sprite:<version> and latest
# (deploy/Dockerfile.full), see .github/actions/sprite-image and the
# README's Deploy section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: The version, from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::${GITHUB_REF_NAME} is no release tag: push v<x.y.z>"; exit 1;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: The package says the tag's version, for this build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"
      - run: npm test
      - run: npm run release
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun of the job finds the release already there: the assets are
        # replaced instead, so the image step after it can run again.
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" rragent.tar.gz rragent.tar.gz.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" rragent.tar.gz rragent.tar.gz.sha256 \
              --title "rragent ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
      - name: The Sprite image
        uses: ./.github/actions/sprite-image
        with:
          tag: ${{ steps.version.outputs.version }}
          latest: "true"
