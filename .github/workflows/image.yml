name: Image

# The Sprite image, ghcr.io/storrito/rragent-sprite:<sha>, where <sha>
# is the git blob SHA of deploy/image/Dockerfile. That is the
# convention a provisioner makes a machine by: Storrito asks GitHub for
# the SHA of main's Dockerfile (the contents API, one request) and
# makes a new agent's machine from that tag, so a change of the
# Dockerfile is a new image and nothing else is; a changed start.sh
# alone changes no SHA, so the Dockerfile's "image: N" line is bumped
# with it. A push to main that touches deploy/image/ builds the image,
# unless the tag exists already (.github/actions/sprite-image with
# when-there: skip): Sprites imports a tag once per organization and
# never pulls it again, so a tag is never pushed over. By hand on a
# branch ("Run workflow"): the branch's Dockerfile SHA is the tag, for
# a sprite to try the branch's image on; a branch whose Dockerfile is
# main's needs none, its bundle reaches a sprite as a release does.
# The image holds no bundle: start.sh downloads the release at a
# machine's first start.
on:
  push:
    branches: [main]
    paths:
      - deploy/image/**
      - .github/workflows/image.yml
      - .github/actions/sprite-image/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: The tag, the Dockerfile's blob SHA
        id: tag
        run: echo "sha=$(git rev-parse HEAD:deploy/image/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/sprite-image
        with:
          tag: ${{ steps.tag.outputs.sha }}
          when-there: skip
