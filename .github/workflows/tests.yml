name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      # the compiler is Clojure: Java for cljf, the Clojure dependencies cached
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: clojure-${{ hashFiles('deps.edn') }}
      # the pictures the model gets are WebP made by ffmpeg (rragent.images):
      # a static build with libwebp and ffprobe, cached; Ubuntu's apt mirror
      # took 15 minutes for the package once
      - uses: actions/cache@v6
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          mkdir -p ~/ffmpeg
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-22-13-06/ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1.tar.xz \
            | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
      - run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build
