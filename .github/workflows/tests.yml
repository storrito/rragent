name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      # the compiler is Clojure: Java for cljf, the Clojure dependencies cached
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: clojure-${{ hashFiles('deps.edn') }}
      # the pictures the model gets are WebP made by ffmpeg (rragent.images):
      # the image's own ffmpeg and ffprobe, the static build
      # deploy/image/ffmpeg.sh names (with libwebp), cached under that
      # file's hash; Ubuntu's apt mirror took 15 minutes for the package once
      - uses: actions/cache@v6
        id: ffmpeg
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ hashFiles('deploy/image/ffmpeg.sh') }}
      - if: steps.ffmpeg.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: bash deploy/image/ffmpeg.sh ~/ffmpeg
      - run: echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build
      # the how-to and example a bot's programs begin from, starters/nbb: the
      # bundle carries it and its tests pass under the nbb the image installs
      - run: ../../../node_modules/.bin/nbb main_test.cljs
        working-directory: dist/starters/nbb
